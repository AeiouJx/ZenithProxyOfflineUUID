name: Publish Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build plugin
        run: ./gradlew build

      - name: Prepare release notes
        shell: bash
        run: |
          JAR_NAME="$(basename build/libs/*.jar)"
          sed \
            -e "s/__VERSION__/${GITHUB_REF_NAME}/g" \
            -e "s/__JAR_NAME__/${JAR_NAME}/g" \
            .github/release-template.md > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: build/libs/*.jar
